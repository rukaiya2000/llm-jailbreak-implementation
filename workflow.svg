<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="900" height="558" role="img" aria-labelledby="pairTitle pairDesc">
  <title id="pairTitle">PAIR iteration loop</title>
  <desc id="pairDesc">
    The attacker LLM (fireworks/deepseek-v4-flash) sends a prompt to the target LLM (navigator/gpt-oss-120b),
    which replies. The judge LLM (openai/gpt-5.5) scores the reply 1-10. If the score meets the success
    threshold the stream stops and reports the result; otherwise the score and response are fed back to the
    attacker, which refines the prompt for up to K iterations. N streams of this loop run in parallel.
  </desc>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#9a9a9a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#e63946"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="618" rx="18" fill="#0a0a0a" stroke="#3a0000" stroke-width="1.5"/>

  <text x="490" y="48" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="17" font-weight="bold" letter-spacing="3" fill="#ffffff">PAIR ITERATION LOOP</text>

  <!-- N parallel streams label + stacked cards behind attacker -->
  <text x="140" y="172" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="10" letter-spacing="1.5" fill="#7a7a7a">N PARALLEL STREAMS</text>

  <rect x="64" y="210" width="200" height="140" rx="14" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
  <rect x="54" y="200" width="200" height="140" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Attacker -->
  <rect x="40" y="190" width="200" height="140" rx="14" fill="#1a1a1a" stroke="#5c0011" stroke-width="1.5"/>
  <text x="140" y="250" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="14" font-weight="bold" letter-spacing="1" fill="#ffffff">ATTACKER</text>
  <text x="140" y="272" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" fill="#8a8a8a">fireworks</text>
  <text x="140" y="290" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" fill="#cccccc">deepseek-v4-flash</text>

  <!-- Target -->
  <rect x="390" y="190" width="200" height="140" rx="14" fill="#1a1a1a" stroke="#5c0011" stroke-width="1.5"/>
  <text x="490" y="250" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="14" font-weight="bold" letter-spacing="1" fill="#ffffff">TARGET</text>
  <text x="490" y="272" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" fill="#8a8a8a">navigator</text>
  <text x="490" y="290" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" fill="#cccccc">gpt-oss-120b</text>

  <!-- Judge -->
  <rect x="740" y="190" width="200" height="140" rx="14" fill="#1a1a1a" stroke="#5c0011" stroke-width="1.5"/>
  <text x="840" y="250" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="14" font-weight="bold" letter-spacing="1" fill="#ffffff">JUDGE</text>
  <text x="840" y="272" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" fill="#8a8a8a">openai</text>
  <text x="840" y="290" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" fill="#cccccc">gpt-5.5</text>

  <!-- forward flow -->
  <line x1="240" y1="260" x2="384" y2="260" stroke="#9a9a9a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="315" y="248" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaaaaa">prompt</text>

  <line x1="590" y1="260" x2="734" y2="260" stroke="#9a9a9a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="665" y="248" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaaaaa">response</text>

  <line x1="840" y1="330" x2="840" y2="380" stroke="#9a9a9a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="880" y="360" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aaaaaa">score 1-10</text>

  <!-- decision diamond -->
  <polygon points="840,385 930,430 840,475 750,430" fill="#1a1a1a" stroke="#e63946" stroke-width="1.5"/>
  <text x="840" y="425" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#eeeeee">score &#8805;</text>
  <text x="840" y="440" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#eeeeee">threshold?</text>

  <!-- yes -> done -->
  <line x1="840" y1="475" x2="840" y2="516" stroke="#9a9a9a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="864" y="500" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#cccccc">YES</text>

  <rect x="740" y="520" width="200" height="70" rx="12" fill="#1a1a1a" stroke="#5c0011" stroke-width="1.5"/>
  <text x="840" y="550" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ffffff">STREAM RESULT</text>
  <text x="840" y="568" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8a8a8a">best score reported</text>

  <!-- no -> feedback loop back to attacker (the refinement mechanism) -->
  <path d="M 750,430 H 140 V 336" fill="none" stroke="#e63946" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="770" y="420" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#e63946">no</text>
  <text x="445" y="412" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#e63946">feedback + score &#8594; refine prompt</text>
  <text x="445" y="426" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#e63946">repeat for iteration k+1 (k &lt; K)</text>
</svg>
